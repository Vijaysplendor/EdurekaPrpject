name: Java CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Set Up JDK
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'adopt-openjdk'

    - name: Build with maven
      run: mvn clean install

    - name: Run Test
      run: mvn test

    - name: package application
      run: mvn package
